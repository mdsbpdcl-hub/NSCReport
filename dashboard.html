<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSC & Load Change Pendency</title>
<meta name="description" content="Pending new service connections and load change requests of NBPDCL and SBPDCL: stages, critical units, delays, trend and review points.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FDEDE0' stroke='%23F5B98C'/%3E%3Cpath d='M13.5 3 5 13.6h6l-1 7.4 9-11.1h-6z' fill='%238A4513'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dash.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.5 2 4 13.6h6.6L9.6 22 20 9.9h-6.7L13.5 2z"/></svg></span>
      <div class="brand-text">
        <h1>NSC &amp; Load Change Pendency</h1>
        <p class="asof" id="asOf">NBPDCL and SBPDCL</p>
      </div>
    </div>
    <div class="bar-actions">
      <span class="fresh" id="fresh" hidden></span>
      <div class="pdfwrap">
        <button class="btn main" id="pdfBtn" type="button" disabled aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 13h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>
          <span>PDF</span>
          <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="pdfmenu" id="pdfMenu" role="menu" hidden></div>
      </div>
      <button class="btn" id="refreshBtn" type="button" title="Get the latest figures">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        <span class="lbl">Refresh</span>
      </button>
      <a class="btn quiet" href="./" title="Make the report and update the figures">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.99 5.99 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <span class="lbl">Update figures</span>
      </a>
      <div class="scope" role="group" aria-label="Scope" id="segDiscom"></div>
    </div>
  </div>
  <div class="tabs-row" id="filters" hidden>
    <nav class="tabs" role="tablist" aria-label="Report" id="segReport"></nav>
    <span class="pchip" id="periodChip" hidden></span>
  </div>
</header>
<div class="crumbs-row" id="crumbsRow" hidden>
  <div class="crumbs" id="crumbs"></div>
  <nav class="jump" aria-label="Sections" id="jump"></nav>
</div>

<main class="page" id="page">
  <div class="state" id="state">
    <div class="spinner" aria-hidden="true"></div>
    <h2>Loading the figures ...</h2>
    <p>This takes a few seconds the first time. Next time the page opens at once.</p>
  </div>
  <div id="content" hidden></div>
</main>

<div class="tip" id="tip" role="tooltip" hidden></div>

<script src="js/dash.js"></script>
</body>
</html>
