<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSC & Load Change Pendency</title>
<meta name="description" content="Pending new service connections and load change requests of NBPDCL and SBPDCL: stages, critical units, delays, trend and review points.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f5c99'/%3E%3Cpath d='M5 17h3V9H5v8zm5.5 0h3V5h-3v12zM16 17h3v-5h-3v5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dash.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 17h3V9H5v8zm5.5 0h3V5h-3v12zM16 17h3v-5h-3v5z"/></svg></span>
      <div>
        <h1>NSC &amp; Load Change Pendency</h1>
        <p class="asof" id="asOf">NBPDCL and SBPDCL</p>
      </div>
    </div>
    <div class="bar-actions">
      <span class="fresh" id="fresh" hidden></span>
      <button class="btn" id="refreshBtn" type="button" title="Get the latest figures">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        <span>Refresh</span>
      </button>
      <div class="pdfwrap">
        <button class="btn primary" id="pdfBtn" type="button" disabled aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          <span>Top 20 pendency (PDF)</span>
        </button>
        <div class="pdfmenu" id="pdfMenu" role="menu" hidden></div>
      </div>
      <a class="btn ghost" href="./" title="Make the report and update the figures">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.99 5.99 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        <span>Update figures</span>
      </a>
    </div>
  </div>
  <div class="filters" id="filters" hidden>
    <div class="seg" role="group" aria-label="Report" id="segReport"></div>
    <div class="seg" role="group" aria-label="DISCOM" id="segDiscom"></div>
    <span class="pchip" id="periodChip" hidden></span>
    <nav class="jump" aria-label="Sections" id="jump"></nav>
  </div>
</header>

<main class="page" id="page">
  <div class="state" id="state">
    <div class="spinner" aria-hidden="true"></div>
    <h2>Loading the figures</h2>
    <p>This takes a few seconds the first time. Next time the page opens at once.</p>
  </div>
  <div id="content" hidden></div>
</main>

<div class="tip" id="tip" role="tooltip" hidden></div>

<script src="js/dash.js"></script>
</body>
</html>
